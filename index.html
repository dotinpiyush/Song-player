<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play-Songs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <ul>
            <li class="brand"><img src="logo.png" alt="spotify"><span>Spotify</span></li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>
    <div class="container">
        <div class="songlist">
            <h1>Best Of NCS - No copyright</h1>
            <div class="songItemContainer">
                <div class="songItem">
                    <img src="covers/1.jpg" alt="1">
                    <span>Let Me love you</span>
                    <span class="songListPlay"><span class="timestamp">05:34<i
                                class="fa-regular fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="covers/1.jpg" alt="1">
                    <span class="songName">Let Me love you</span>
                    <span class="songListPlay"><span class="timestamp">05:34<i
                                class="fa-regular fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="covers/1.jpg" alt="1">
                    <span class="songName">Let Me love you</span>
                    <span class="songListPlay"><span class="timestamp">05:34<i
                                class="fa-regular fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="covers/1.jpg" alt="1">
                    <span class="songName">Let Me love you</span>
                    <span class="songListPlay"><span class="timestamp">05:34<i
                                class="fa-regular fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="covers/1.jpg" alt="1">
                    <span  class="songName">Let Me love you</span>
                    <span class="songListPlay"><span class="timestamp">05:34<i
                                class="fa-regular fa-circle-play"></i></span></span>
                </div>
            </div>


        </div>
        <div class="songBanner"></div>
    </div>
    <div class="bottom">
        <input type="range" name="range" id="myProgressbar" min="0" max="100">
        <div class="icons">
            <i class="fa-solid fa-backward"></i>
            <i class="fa-regular fa-circle-play" id="masterPlay"></i>
            <i class="fa-solid fa-forward"></i>
        </div>
        <div class="songinfo">
            <img src="playing.gif" width="32px" alt="">Let Me Know</div>
    </div>
    <script src="https://kit.fontawesome.com/90c7438382.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
